name: Android PC Environment CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust-tests:
    name: Rust Workspace Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.100.0'
          targets: aarch64-linux-android
      - name: Run cargo test --workspace
        working-directory: rust
        run: cargo test --locked --workspace
      - name: Install RustSec audit tool
        run: cargo install cargo-audit --version 0.23.0 --locked
      - name: Check locked Rust dependencies against RustSec
        working-directory: rust
        run: cargo audit

  android-build:
    name: Android ARM64 NDK & Debug APK
    runs-on: ubuntu-latest
    needs: rust-tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.100.0'
          targets: aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 ndk;30.0.16248370'
      - name: Build ARM64 Native Engine
        working-directory: rust
        run: cargo ndk --target arm64-v8a --platform 26 --output-dir ../android/app/src/main/jniLibs -- build --locked --release --package androidpc-android-bridge --lib
      - name: Build Debug & Instrumentation Test APKs
        working-directory: android
        run: bash ./gradlew assembleDebug assembleDebugAndroidTest
